name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # swiftc で直接組んで、出来上がった .app の --selftest を回す。
  # 画面にもファイルにも触らないので、ランナーで動く。
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Sparkle は build.sh が無ければ取ってくる。毎回取らずに済ませる。
      - uses: actions/cache@v6
        with:
          path: Vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('build.sh') }}
      # 整形の規則は .swift-format にある。既定との差は字下げ4つと行幅120だけ。
      - run: swift format lint --strict -r Sources
      - run: ./build.sh
      - run: ./VStats.app/Contents/MacOS/VStats --selftest
      # 寸法・字・角の数字は Sources/Design.swift にだけ書く
      - run: ./Tools/design-rules.sh

  # ランディングページ。Renovate の自動マージを止める門番はこれだけなので、lint・型検査・ビルドまで回す
  lp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版は package.json の packageManager が正本。ここにも書くと食い違ったときに落ちる
      - uses: pnpm/action-setup@v6
      # pnpm 11 は node:sqlite を使うので Node 22 以上が要る
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter vstats-lp lint
      - run: pnpm --filter vstats-lp typecheck
      - run: pnpm --filter vstats-lp build
